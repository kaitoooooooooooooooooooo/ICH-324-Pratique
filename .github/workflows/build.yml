name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v5

      - name: Installation de Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Installation des dépendances
        run: npm ci

      - name: Exécution des tests
        run: npm run test:coverage

      - name: Publication des résultats de tests
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: junit.xml

      - name: Publication de l'artefact
        uses: actions/upload-artifact@v5
        with:
          name: build-artifact
          path: |
            index.js
            package.json
            junit.xml
      - name: Partage du rapport de couverture
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/lcov.info
  sonarcloud:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source (historique complet)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0     

      - name: Récupération du rapport de couverture
        uses: actions/download-artifact@v5
        with:
          name: coverage-report
          path: coverage/


      - name: Analyse SonarCloud et Quality Gate
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
